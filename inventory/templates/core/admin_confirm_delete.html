{% extends 'core/base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div style="max-width:480px; margin:60px auto;">
    <div class="card" style="padding:2rem; text-align:center;">
        <svg width="40" height="40" fill="none" stroke="#dc2626"
             stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 16px;">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94
                     a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <h2 style="font-size:1.1rem; font-weight:600; margin-bottom:8px;">
            Delete {{ product.name }}?
        </h2>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:24px;">
            This will permanently delete the product and all associated
            sales records. This action cannot be undone.
        </p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <a href="{% url 'core:admin_panel' %}" class="quick-btn outline">
                Cancel
            </a>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="quick-btn"
                        style="background:#dc2626; color:white;">
                    Yes, Delete
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
